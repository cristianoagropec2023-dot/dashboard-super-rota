<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | Dashboard Super Rota</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f5;min-height:100vh;display:grid;place-items:center;color:#263238}.card{width:min(420px,92vw);background:#fff;padding:38px;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.14);text-align:center}.logo{max-width:150px;max-height:95px;object-fit:contain;margin-bottom:14px}h1{font-size:24px;margin:8px 0}p{color:#64748b;margin-bottom:26px}.campo{text-align:left;margin:14px 0}.campo label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}.campo input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}.campo input:focus{outline:none;border-color:#2f6b52;box-shadow:0 0 0 3px rgba(47,107,82,.12)}button{width:100%;padding:14px;border:0;border-radius:9px;background:#2f6b52;color:#fff;font-weight:bold;font-size:15px;cursor:pointer;margin-top:10px}.erro{background:#fff1f2;color:#b42318;padding:10px;border-radius:8px;font-size:14px;margin-bottom:15px}</style></head>
<body><main class="card"><img class="logo" src="{{ url_for('static', filename='logo_fazenda.png') }}" alt="Logo"><h1>DASHBOARD SUPER ROTA</h1><p>Acesso restrito</p>{% with mensagens=get_flashed_messages(with_categories=true) %}{% for categoria,mensagem in mensagens %}<div class="erro">{{ mensagem }}</div>{% endfor %}{% endwith %}<form method="POST"><div class="campo"><label>Usuário</label><input name="usuario" required autofocus></div><div class="campo"><label>Senha</label><input type="password" name="senha" required></div><button type="submit">ENTRAR</button></form></main></body></html>
